# Event source configurations.
#
# One list is fetched by one script, `scripts/fetch_sources.py`. `type:` is the
# only dispatch key and must match an entry in that script's FETCHERS table.
# `impersonate: true` means the source's host answers only to a curl-cffi
# Chrome-TLS session rather than plain urllib -- it is a property of the host,
# not of the source, and only four entries currently need it. The two lists
# below (webfetch: / sources:) are kept separate only because a webfetch source
# owns a committed snapshot file under scripts/webfetch_snapshots/ while the
# others share data/raw_events.json.
#
# Manual overflow snapshots (*_manual.json) are merged by dedupe.py. Libraries
# (kingston_libraries, frankston_libraries) are future work.

webfetch:
  - name: "Kingston Council"
    id: "kingston_council"
    type: "granicus"
    # 403 on plain urllib: the Granicus WAF.
    impersonate: true
    url: "https://www.kingston.vic.gov.au/community/events/upcoming-events"
    base: "https://www.kingston.vic.gov.au"
    detail_cap: 12
    snapshot: "kingston_council.json"
    # NOTE: Granicus pager is JS postback — page 1 only. Deeper pages via
    # manual snapshots named kingston_council_manual.json.

  - name: "Kingston Arts"
    id: "kingston_arts"
    type: "granicus"
    # 403 on plain urllib: the Granicus WAF.
    impersonate: true
    url: "https://www.kingstonarts.com.au/whats-on"
    base: "https://www.kingstonarts.com.au"
    detail_cap: 12
    snapshot: "kingston_arts.json"

  - name: "Bayside Council"
    id: "bayside_live"
    type: "bayside"
    url: "https://www.bayside.vic.gov.au/explore-bayside/events"
    max_pages: 12
    detail_cap: 150
    snapshot: "bayside_auto.json"

  - name: "Kingston Seniors Festival"
    id: "kingston_seniors"
    type: "kingston_seniors_pdf"
    pdf_url: "https://www.kingston.vic.gov.au/files/sharedassets/public/v/2/hptrim/social-development-community-development-seniors-festival/seniors-festival-magazine_fa-spreads.pdf"
    info_url: "https://www.kingston.vic.gov.au/community/events/upcoming-events/seniors-festival"
    # ANNUAL: must be updated when the new festival guide is published.
    # health_check.py will fail the build if this is stale during Sept-Nov.
    year: 2026
    snapshot: "kingston_seniors.json"

  - name: "Kingston Community Groups"
    id: "kingston_groups"
    type: "oc_directory"
    # 403 on plain urllib: the Granicus/OpenCities WAF, same host as the two
    # kingston_council / kingston_arts entries above.
    impersonate: true
    url: "https://www.kingston.vic.gov.au/community/get-involved/community-groups"
    max_pages: 20
    # 117 entries, one detail page each. The cap is a bound, not a budget: the
    # listing states its own total and the fetcher refuses to publish a
    # fraction of it, so reaching this cap is a reported warning rather than a
    # silent truncation.
    detail_cap: 150
    snapshot: "kingston_groups.json"
    # An OpenCities local directory. The listing states no meeting time at all
    # -- it carries only a name, a street address, a summary and a curated Type
    # tag -- so every entry's own page must be opened, and that page is the only
    # place the schedule exists. Pagination is an ASP.NET postback: ?page=2 is
    # accepted and ignored. See webfetch_directory.py for both traps.

  # NOT ACTIVE until its first crawl completes. The fetcher is now resumable
  # and safe to run: it takes a bounded slice per run and caches both the pages
  # read and the rows they yielded, so no single run is ever the 876-request
  # run that earned the IP block. Run it until it reports "all 876 occurrence
  # pages read":
  #
  #   python scripts/fetch_sources.py --source frankston_live   # repeat
  #
  # Each run refuses to publish a partial crawl, which is intended -- the
  # calendar is wrong in a way nothing downstream can detect if it silently
  # takes eight ninths of a directory. So the first few scheduled runs will
  # fail this source by design, and the entry stays commented until the cache
  # says the crawl is done (D3: a configured source with no snapshot turns
  # every run red for no reason).
  #
  # - name: "Frankston"
  #   id: "frankston_live"
  #   type: "everi"
  #   # Answers only to a browser-impersonating session.
  #   impersonate: true
  #   url: "https://whatsonfrankston.com/"
  #   sitemap: "https://whatsonfrankston.com/sitemap.xml"
  #   # 876 occurrence URLs, some reaching a year out. Bounded by the horizon
#   # rather than by a cap, so the fetcher reports what it chose not to
  #   # publish instead of silently publishing a fraction.
  #   horizon_days: 120
  #   # Pages read per run. This asks for progress; `max_requests_per_run` below
  #   # is what actually limits pressure, and the fetcher caps the slice by it,
  #   # so neither number has to be trusted on its own. 856 pages at the
  #   # tolerated rate is the run that gets an IP blocked, and the block outlives
  #   # the run, so the crawl completes over several scheduled runs instead of
  #   # inside one -- about 19 of them at these numbers.
  #   slice_size: 45
  #   # Seconds between requests. Applied before *every* request, on every code
  #   # path, sitemap fetches included; it used to be a sleep after the last
  #   # statement of a successful page, so every page that took an early
  #   # `continue` -- which is most of them, the sitemap running a year out
  #   # against a 120-day horizon -- was fetched with no pause at all.
  #   crawl_delay: 0.35
  #   # Hard cap on requests in one run. The host tolerated 12 pages once and 31
  #   # another time before refusing, so its budget is real but not well
  #   # characterised; 60 sits above both and below the slice it caps.
  #   max_requests_per_run: 60
  #   snapshot: "frankston_auto.json"
  #   # Crawl progress: which pages are read, and the rows they yielded.
  #   # Deliberately not committed -- it is per-IP state, and a stale one from
  #   # another machine would suppress a crawl that has not happened there.
  #   cache_file: "scripts/webfetch_snapshots/frankston_auto.progress.json"

  - name: "Frankston City Libraries"
    id: "frankston_libraries"
    type: "frankston_libraries"
    # Three series were withheld from the page with no dates to publish: the
    # archive recorded Justice of the Peace Saturdays, Basic Tech Help and
    # Weekend Board Games without a schedule, because the site that states it
    # (this one) was not crawled. Each programme's own page lists every date in
    # its term, so this is the fetcher that supplies them -- and the live feed
    # then clears their archived status on its own.
    # 403 without a browser TLS fingerprint. Reachable from an impersonating
    # session (verified), so `impersonate` is required rather than a workaround.
    impersonate: true
    url: "https://library.frankston.vic.gov.au/Whats-On"
    # The listing publishes ten cards and no working pagination: ?page=2, ?p=2
    # and ?pageNumber=2 all return page 1, and /Page-2 is a 404. The cap is
    # therefore the card count, not a guess at page depth.
    detail_cap: 10
    snapshot: "frankston_libraries.json"

  - name: "Cheltenham Community Centre"
    id: "ccc"
    type: "ccc"
    detail_cap: 30
    snapshot: "ccc.json"
    # D21: the venue is config, not a guess. These two addresses were four
    # constants inside webfetch_ccc.py until this moved them here; a wrong
    # address publishes silently and nothing downstream can detect it.
    venues:
      default:
        name: "Cheltenham Community Centre"
        address: "8 Chesterville Road, Cheltenham VIC 3192"
      hall:
        name: "Cheltenham Hall"
        address: "1218 Nepean Highway, Cheltenham VIC 3192"
    pages:
      - "https://www.chelt.com.au/free-activities.html"
      - "https://www.chelt.com.au/exercise-dance-yoga.html"
      - "https://www.chelt.com.au/social-activities.html"
      - "https://www.chelt.com.au/creative-classes.html"
      - "https://www.chelt.com.au/workshops.html"
      - "https://www.chelt.com.au/computer-courses.html"
      - "https://www.chelt.com.au/learn-english.html"
      - "https://www.chelt.com.au/school-holiday-activities.html"
      - "https://www.chelt.com.au/youth.html"
      - "https://www.chelt.com.au/soul-cafe.html"
      - "https://www.chelt.com.au/playgroups.html"
      - "https://www.chelt.com.au/funnet.html"
      - "https://www.chelt.com.au/holiday-netball-clinics.html"

sources:
  - name: "Kingston Hubs"
    id: "kingston_hubs"
    type: "api"
    calendars:
      - "a1bc2435-21cb-4d26-9b8a-80fc0a7a74df"  # Chelsea Activity Hub
      - "74480036-6bf3-4162-a0a2-63b4b6746dee"  # Patterson Lakes Community Centre
    # Every id in `calendars` needs a venue AND a street address here. The API
    # returns neither, so this map is the only place they come from, and an
    # unmapped id is a hard fetch failure rather than a guess: a wrong address
    # is published silently, while a missing one is a red build. Addresses are
    # taken from the council's own venue and event pages.
    calendar_venues:
      "a1bc2435-21cb-4d26-9b8a-80fc0a7a74df":
        name: "Chelsea Activity Hub"
        address: "3-5 Showers Ave, Chelsea 3196"
      "74480036-6bf3-4162-a0a2-63b4b6746dee":
        name: "Patterson Lakes Community Centre"
        address: "54-70 Thompson Rd, Patterson Lakes 3197"
    # Uses the OpenCities calendar API (ocapi)
    # POST /ocapi/calendars/getcalendaritems with JSON payload
    # GET /ocapi/get/contentinfo for event details

  - name: "Greater Dandenong"
    id: "greater_dandenong"
    type: "greater_dandenong"
    # The listing answers plain urllib; the event DETAIL pages -- the only place
    # the suburb is stated, and so the only place the catchment below can be
    # applied -- do not reliably.
    impersonate: true
    url: "https://www.greaterdandenong.vic.gov.au/events"
    max_pages: 15
    # Drupal platform - filter to Springvale + Keysborough only. The suburb is
    # only on the event detail page, which is why each event is opened.
    suburb_filter:
      - "Springvale"
      - "Keysborough"

  - name: "Greater Dandenong Libraries"
    id: "gd_libraries"
    type: "gd_libraries"
    impersonate: true
    url: "https://libraries.greaterdandenong.vic.gov.au/libraries/events"
    max_pages: 10
    # Same CMS and the same catchment as greater_dandenong above, so the same
    # filter. Without it this source published rows in Dandenong while its
    # sibling silently dropped them.
    suburb_filter:
      - "Springvale"
      - "Keysborough"

  - name: "Chatty Cafe"
    id: "chatty_cafe"
    type: "venues"
    # Venue pages are built from each slug below
    # (https://chattycafeaustralia.org.au/venue/<slug>/), so there is no
    # listing url to configure. Selected venues near Cheltenham, Mentone,
    # Mordialloc, Chelsea.
