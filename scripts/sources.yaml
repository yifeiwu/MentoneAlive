        address: "160 Thames Promenade, Chelsea Heights VIC 3196"
        schedule: "Wednesday 10am-12pm (school term only)"
      - slug: "matts-place-chelsea"
        name: "Matt's Place Chelsea"
        address: "12-14 Thames Promenade, Chelsea VIC 3196"
        schedule: "Tuesday 10.45am - 12.45pm"
      - slug: "matts-place-cheltenham"
        name: "Matt's Place Cheltenham"
        address: "161 Park Rd, Cheltenham VIC 3192"
        schedule: "Thursday 10.30am - 1pm"
