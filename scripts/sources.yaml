      - slug: "cheltenham-community-centre"
        name: "Cheltenham Community Centre"
        address: "8 Chesterville Rd, Cheltenham VIC 3192"
        schedule: "Wednesdays & Thursdays at 10:30am during school term"
      - slug: "chelsea-activity-hub"
        name: "Chelsea Activity Hub"
        address: "3-5 Showers Ave, Chelsea VIC 3196"
        schedule: "Tuesday 10.00am - 11.30am (1st & 3rd Tuesdays of the Month)"
      - slug: "chelsea-heights-community-centre"
