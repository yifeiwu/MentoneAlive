name: Update Events

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check scripts
        run: python -m compileall -q scripts

      # Both fetchers exit non-zero when a source fails or returns nothing, and
      # a multi-page crawl that stops early keeps the previous snapshot rather
      # than overwriting it. A failed run therefore leaves the last good
      # events.json and index.html in place instead of publishing a smaller
      # calendar -- that is intentional, do not add continue-on-error here.
      - name: Fetch events (Python sources only)
        timeout-minutes: 15
        run: python scripts/fetch_events.py

      - name: Webfetch sources (browser-impersonating Python)
        timeout-minutes: 45
        run: python scripts/webfetch_sources.py

      - name: Deduplicate (+ webfetch snapshots, infer dates, prune 90d)
        timeout-minutes: 10
        run: python scripts/dedupe.py

      - name: Build site
        timeout-minutes: 10
        run: python scripts/build_site.py

      - name: Health check
        timeout-minutes: 5
        run: python scripts/health_check.py

      - name: Check classifier rules
        timeout-minutes: 5
        run: python scripts/activity_types.py

      - name: Check status / service rules
        timeout-minutes: 5
        run: python scripts/status.py

      # recurrence.py decides the day a reader turns up, so a wrong date is
      # worse than a missing event: the row still renders and still looks
      # bookable. Its cases are real listing text, and each was a live defect
      # that shipped a correct-looking wrong date through a green build.
      - name: Check date inference rules
        timeout-minutes: 5
        run: python scripts/recurrence.py

      - name: Check commercial detection rules
        timeout-minutes: 5
        run: python scripts/commercial.py

      - name: Check Granicus address parsing
        timeout-minutes: 5
        run: python scripts/webfetch_granicus.py

      # Nothing above can see a JavaScript error: compileall only reads
      # Python, and the other checks only read events.json. A syntax error in
      # the template therefore builds and passes, then publishes a blank
      # calendar. This renders the built page and asserts it has rows, so a
      # blank page fails the run before the commit below. Chrome is
      # preinstalled on ubuntu-latest; the check skips if none is found.
      #
      # It also measures the desktop column widths, which is the only check
      # that can see the results grid overflowing its container. The price
      # column was a third of the table because one row's price_text was a
      # 58-character leaked button label and the cell was nowrap: the markup
      # was correct and only the layout was wrong, and .tablewrap's
      # overflow-x:auto turned it into a silent horizontal scroll.
      - name: Check the page renders results
        timeout-minutes: 5
        run: python scripts/render_check.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json index.html scripts/webfetch_snapshots/*.json
          git diff --cached --quiet || git commit -m "chore: update events data"
          # The commit must be pushed: data/events.json is the canonical store
          # that the NEXT dedupe.py run reads as its pre-merge baseline. Commit
          # without pushing leaves that store frozen at the last pushed commit,
          # so the repo silently drifts away from the deployed site.
          git push

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
