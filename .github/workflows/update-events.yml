name: Update Events

on:
  schedule:
    # Weekly, Monday 06:00 UTC. The sources publish a calendar rather than a
    # feed of changes, so a day-over-day diff is mostly re-downloading the same
    # pages; the one that changes fastest is the seniors festival, which is
    # hand-synced anyway. Use workflow_dispatch for an off-cycle refresh.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install .

      # Pure rule assertions first (fail-fast, no network): a broken classifier
      # should not cost a 45-minute crawl.
      - name: Check rule assertions
        timeout-minutes: 10
        run: python scripts/checks.py

      # Both exit non-zero when a source fails or returns nothing, and a
      # multi-page crawl that stops early keeps the previous snapshot rather
      # than overwriting it. A failed run therefore leaves the last good
      # events.json and index.html in place instead of publishing a smaller
      # calendar -- that is intentional, do not add continue-on-error here.
      #
      # The config is validated before any request, so a typo is one message
      # naming the entry rather than a KeyError from inside a fetcher.
      #
      # 60 minutes, and most of it is one source waiting on purpose:
      # kingston_council walks a 31-page listing and opens all 301 detail pages
      # at one request per five seconds (D47), which is ~28 minutes of
      # deliberate sleeping. It is paced rather than quick because it is the
      # host behind the Granicus WAF, and the previous 45 was measured against
      # a run that never left page 1.
      - name: Fetch sources
        timeout-minutes: 60
        run: python scripts/fetch_sources.py

      - name: Deduplicate (+ snapshots, infer dates, prune 90d)
        timeout-minutes: 10
        run: python scripts/dedupe.py

      - name: Build site
        timeout-minutes: 10
        run: python scripts/build_site.py

      # Must run after build_site.py: it verifies the status and
      # default-hidden flags that build_site.py writes, so the other order
      # fails the build, which is the intended outcome.
      - name: Health check
        timeout-minutes: 5
        run: python scripts/health_check.py

      # Nothing above can see a JavaScript error: the other checks only read
      # Python and events.json. A syntax error in the template therefore builds
      # and passes, then publishes a blank calendar. This renders the built page
      # and asserts it has rows, so a blank page fails the run before the commit
      # below. Chrome is preinstalled on ubuntu-latest; the check skips if none is
      # found.
      #
      # It also measures the desktop column widths, which is the only check that
      # can see the results grid overflowing its container. The price column was
      # a third of the table because one row's price_text was a 58-character
      # leaked button label and the cell was nowrap: the markup was correct and
      # only the layout was wrong, and .tablewrap's overflow-x:auto turned it
      # into a silent horizontal scroll.
      - name: Check the page renders results
        timeout-minutes: 5
        run: python scripts/render_check.py

      - name: Commit updated data
        timeout-minutes: 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json index.html scripts/webfetch_snapshots/*.json
          git diff --cached --quiet || git commit -m "chore: update events data"
          # The commit must be pushed: data/events.json is the canonical store
          # that the NEXT dedupe.py run reads as its pre-merge baseline. Commit
          # without pushing leaves that store frozen at the last pushed commit,
          # so the repo silently drifts away from the deployed site.
          git push

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        timeout-minutes: 5
        id: deployment
        uses: actions/deploy-pages@v4