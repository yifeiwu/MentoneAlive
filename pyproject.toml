[project]
name = "eventscal"
version = "1.0.0"
description = "Community events aggregator for Melbourne's southeastern suburbs"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "pyyaml==6.0.2",
    "rapidfuzz==3.14.6",
    "curl-cffi==0.16.3",
    "pypdf==6.19.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Verification only, and deliberately not in the pins above: nothing the
# scrapers import needs a linter, and adding one to the runtime list would make
# every `pip install .` carry a tool that only `checks.py` uses. CI installs
# this group (`pip install ".[dev]"`) so the ruff gate in checks.py actually
# gates there; locally its absence is reported rather than fatal.
[project.optional-dependencies]
dev = ["ruff==0.16.7"]

# A collection of scripts, not an installable library: nothing here is imported
# as `eventscal.something`, and `scripts/` has no __init__.py. Declaring no
# modules keeps the build from looking for one -- without this, setuptools
# auto-discovery fails on the flat layout, which is why the pins below were
# never actually installable and CI carried a second copy of them.
[tool.setuptools]
py-modules = []